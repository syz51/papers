[package]
name = "papers"
version = "0.12.5"
edition = "2024"
rust-version = "1.99"
description = "Literature CLI for agent-driven research: arXiv, Crossref and OpenAlex metadata, a reference registry, open-access reading, and metadata verification"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["research", "bibliography", "arxiv", "crossref", "openalex"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
claimcheck = { git = "https://github.com/syz51/claimcheck", rev = "65d0aa91ca84d677ea99833cd0c9ce81ea16b9cc" }
clap = { version = "4.6.7", features = ["derive"] }
headless_chrome = "1.0.22"
jiff = "0.2.39"
pdf-extract = "0.12.1"
regex = "1.13.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.0"
unicode-normalization = "0.1.26"
ureq = "3.5.1"
yaml_serde = "0.10.7"
